<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#EE0979"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" fill="#FAFAFA"/>
  <rect x="0" y="0" width="1000" height="56" fill="url(#hdr)"/>
  <text x="24" y="35" font-size="20" font-weight="700" fill="#fff">IntelliFlow Agent — Architecture</text>

  <!-- Client -->
  <rect x="40" y="100" width="200" height="90" rx="10" fill="#fff" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="140" y="135" font-size="14" font-weight="700" text-anchor="middle" fill="#111">Browser UI</text>
  <text x="140" y="155" font-size="11" text-anchor="middle" fill="#6B7280">Customer inquiry form</text>
  <text x="140" y="170" font-size="11" text-anchor="middle" fill="#6B7280">Human-in-the-loop console</text>

  <!-- API Gateway -->
  <rect x="320" y="100" width="200" height="90" rx="10" fill="#fff" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="420" y="135" font-size="14" font-weight="700" text-anchor="middle" fill="#111">API Gateway</text>
  <text x="420" y="155" font-size="11" text-anchor="middle" fill="#6B7280">Alibaba Cloud API Gateway</text>
  <text x="420" y="170" font-size="11" text-anchor="middle" fill="#6B7280">Auth, rate limiting</text>

  <!-- ECS -->
  <rect x="600" y="100" width="220" height="90" rx="10" fill="#fff" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="710" y="130" font-size="14" font-weight="700" text-anchor="middle" fill="#111">ECS — Agent Orchestrator</text>
  <text x="710" y="150" font-size="11" text-anchor="middle" fill="#6B7280">Workflow engine</text>
  <text x="710" y="165" font-size="11" text-anchor="middle" fill="#6B7280">Tool calls + approval gates</text>
  <text x="710" y="180" font-size="11" text-anchor="middle" fill="#6B7280">Decision logging</text>

  <!-- arrows row 1 -->
  <line x1="240" y1="145" x2="318" y2="145" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="145" x2="598" y2="145" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- downstream services -->
  <rect x="600" y="240" width="160" height="80" rx="10" fill="#F1F8E9" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="680" y="270" font-size="13" font-weight="700" text-anchor="middle" fill="#1B5E20">DashScope</text>
  <text x="680" y="288" font-size="11" text-anchor="middle" fill="#33691E">Qwen-Max — intent &amp;</text>
  <text x="680" y="302" font-size="11" text-anchor="middle" fill="#33691E">response generation</text>

  <rect x="780" y="240" width="160" height="80" rx="10" fill="#F1F8E9" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="860" y="270" font-size="13" font-weight="700" text-anchor="middle" fill="#1B5E20">ApsaraDB RDS</text>
  <text x="860" y="288" font-size="11" text-anchor="middle" fill="#33691E">Customer, order &amp;</text>
  <text x="860" y="302" font-size="11" text-anchor="middle" fill="#33691E">approval records</text>

  <rect x="600" y="340" width="160" height="80" rx="10" fill="#F1F8E9" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="680" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1B5E20">ApsaraDB Redis</text>
  <text x="680" y="388" font-size="11" text-anchor="middle" fill="#33691E">Workflow / session</text>
  <text x="680" y="402" font-size="11" text-anchor="middle" fill="#33691E">state, queues</text>

  <rect x="780" y="340" width="160" height="80" rx="10" fill="#F1F8E9" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="860" y="370" font-size="13" font-weight="700" text-anchor="middle" fill="#1B5E20">OSS</text>
  <text x="860" y="388" font-size="11" text-anchor="middle" fill="#33691E">Attachments &amp;</text>
  <text x="860" y="402" font-size="11" text-anchor="middle" fill="#33691E">audit log archive</text>

  <!-- arrows ECS to services -->
  <line x1="710" y1="190" x2="680" y2="238" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="190" x2="860" y2="238" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="320" x2="690" y2="338" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="320" x2="850" y2="338" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Human-in-the-loop -->
  <rect x="40" y="240" width="200" height="100" rx="10" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1.5"/>
  <text x="140" y="270" font-size="13" font-weight="700" text-anchor="middle" fill="#E65100">Human-in-the-Loop</text>
  <text x="140" y="290" font-size="11" text-anchor="middle" fill="#6D4C41">Manager approves /</text>
  <text x="140" y="304" font-size="11" text-anchor="middle" fill="#6D4C41">rejects / escalates</text>
  <text x="140" y="320" font-size="11" text-anchor="middle" fill="#6D4C41">via the browser UI</text>

  <line x1="140" y1="190" x2="140" y2="238" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="240" y1="280" x2="598" y2="170" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Notes box -->
  <rect x="40" y="460" width="920" height="120" rx="10" fill="#fff" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="60" y="486" font-size="13" font-weight="700" fill="#111">Notes</text>
  <text x="60" y="508" font-size="12" fill="#374151">1. ECS hosts the agent orchestrator: classifies intent, extracts entities, checks approval thresholds, and routes to a human reviewer when needed.</text>
  <text x="60" y="528" font-size="12" fill="#374151">2. DashScope (Qwen-Max) handles intent classification and drafts customer-facing responses; ECS calls it over HTTPS.</text>
  <text x="60" y="548" font-size="12" fill="#374151">3. Approval, rejection, and escalation decisions are written to RDS and surfaced live in the Decision Log panel for auditability.</text>
  <text x="60" y="568" font-size="12" fill="#374151">4. The repository's deployment-proof code file and recording (linked from the in-app "Architecture &amp; Links" panel) verify this is live on Alibaba Cloud.</text>
</svg>

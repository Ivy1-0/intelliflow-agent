<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>DataPilot Agent architecture</title>
<desc>Browser frontend connects to a FastAPI backend running on an Alibaba Cloud ECS instance, which calls DashScope Qwen-Max and Alibaba Cloud OSS.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="420" fill="#ffffff"/>

<rect x="240" y="40" width="200" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Browser (frontend)</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Full pipeline runs here</text>

<line x1="340" y1="96" x2="340" y2="128" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="352" y="112" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">optional</text>

<rect x="140" y="130" width="400" height="150" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="160" y="155" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#042C53">Alibaba Cloud ECS instance</text>

<rect x="190" y="195" width="300" height="60" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="215" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">FastAPI backend</text>
<text x="340" y="235" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">main.py — real API calls</text>

<path d="M340 255 L340 300" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M340 300 L260 300 L260 318" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 300 L500 300 L500 318" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="150" y="320" width="220" height="56" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="260" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">DashScope Qwen-Max</text>
<text x="260" y="358" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Generates narrative</text>

<rect x="410" y="320" width="180" height="56" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">OSS bucket</text>
<text x="500" y="358" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Archives report text</text>
</svg>
